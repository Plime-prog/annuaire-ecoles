name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet aussi de lancer le build à la main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle-version: '8.7'

      - name: Compiler l'APK debug
        run: gradle assembleDebug

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: annuaire-ecoles-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
